<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/produto_listar.js" defer></script>
    <title>Listagem de Produtos</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Produtos</span>&emsp;
            <a href="./produto_cadastrar.html">Cadastrar</a>&emsp;
            <a href="./produto_listar.html">Listar</a>&emsp;
            <a href="./produto_consultar.html">Consultar</a>&emsp;
            <a href="./produto_atualizar.html">Atualizar</a>&emsp;
            <a href="./produto_apagar.html">Apagar</a>
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h2>Produtos Cadastrados</h2>
        <br>
        <button id="btn_atualizar_lista" class="btn_gerar">Atualizar Lista</button>
        <br><br>
        <div id="resposta" class="resposta"></div>
        <br>
        <div style="overflow-x:auto;">
            <table id="tabela_produtos">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Desconto (%)</th>
                        <th>Estoque</th>
                        <th>Marca</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo_tabela_produtos"></tbody>
            </table>
        </div>
    </main>
</body>
</html>
