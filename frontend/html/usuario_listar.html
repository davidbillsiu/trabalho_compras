<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/style.css">

    <script src="../js/usuario_listar.js" defer></script>

<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Usuários</span>&emsp;

        <br>
        <button id="btn_atualizar_lista" class="btn_gerar">Atualizar Lista</button>

        <div id="resposta" class="resposta"></div>

        <div style="overflow-x:auto;">
            <table id="tabela_usuarios">

                    <tr>

                        <th>Nome</th>
                        <th>Sobrenome</th>

                        <th>E-mail</th>

                        <th>Estado</th>

                    </tr>
                </thead>
                <tbody id="corpo_tabela_usuarios"></tbody>
            </table>
